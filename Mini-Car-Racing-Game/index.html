<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Racer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🏎️ SPEED RACER</h1>
            <p>Avoid the traffic and survive!</p>
        </header>
        <div class="score-board">
            <div class="score-item">
                <span>SCORE</span>
                <strong>0000</strong>
            </div>
            <div class="score-item">
                <span>SPEED</span>
                <strong>120 KM/H</strong>
            </div>
            <div class="score-item">
                <span>LEVEL</span>
                <strong>1</strong>
            </div>
        </div>
        <div class="game-area">
            <div class="road">
                <div class="road-line line-left"></div>
                <div class="road-line line-right"></div>
                <div class="enemy-car enemy-one">
                    <div class="car-top"></div>
                    <div class="car-window"></div>
                    <div class="car-hood"></div>
                    <div class="car-light left-light"></div>
                    <div class="car-light right-light"></div>
                    <div class="wheel left-wheel"></div>
                    <div class="wheel right-wheel"></div>
                </div>
                <div class="enemy-car enemy-two">
                    <div class="car-top"></div>
                    <div class="car-window"></div>
                    <div class="car-hood"></div>
                    <div class="car-light left-light"></div>
                    <div class="car-light right-light"></div>
                    <div class="wheel left-wheel"></div>
                    <div class="wheel right-wheel"></div>
                </div>
                <div class="enemy-car enemy-three">
                    <div class="car-top"></div>
                    <div class="car-window"></div>
                    <div class="car-hood"></div>
                    <div class="car-light left-light"></div>
                    <div class="car-light right-light"></div>
                    <div class="wheel left-wheel"></div>
                    <div class="wheel right-wheel"></div>
                </div>
                <div class="player-car">
                    <div class="player-top"></div>
                    <div class="player-window"></div>
                    <div class="player-hood"></div>
                    <div class="player-light left-light"></div>
                    <div class="player-light right-light"></div>
                    <div class="player-wheel left-wheel"></div>
                    <div class="player-wheel right-wheel"></div>
                    <div class="player-spoiler"></div>
                </div>
            </div>
        </div>
        <div class="instructions">
            <p>🏆 Avoid the cars!</p>
            <div class="controls">
                <span>⬅️ LEFT</span>
                <span>RIGHT ➡️</span>
            </div>
        </div>
        <button class="start-btn">START RACE</button>
    </div>
</body>
</html>
